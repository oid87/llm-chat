<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Local LLM Chat</title>
<style>
  :root {
    --bg: #f7f7f8;
    --panel: #ffffff;
    --text: #1d1d1f;
    --muted: #6e6e73;
    --border: #d2d2d7;
    --user: #0a84ff;
    --user-text: #ffffff;
    --bot: #ececf1;
    --err: #c9302c;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1c1c1e;
      --panel: #2c2c2e;
      --text: #f2f2f7;
      --muted: #98989f;
      --border: #3a3a3c;
      --user: #0a84ff;
      --user-text: #ffffff;
      --bot: #3a3a3c;
      --err: #ff6961;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1c1c1e;
    --panel: #2c2c2e;
    --text: #f2f2f7;
    --muted: #98989f;
    --border: #3a3a3c;
    --user: #0a84ff;
    --user-text: #ffffff;
    --bot: #3a3a3c;
    --err: #ff6961;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", sans-serif;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 12px 16px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }
  header h1 { font-size: 16px; margin: 0; flex: 1 1 auto; }
  header button, header input { font: inherit; }
  details.settings { width: 100%; }
  details.settings summary { cursor: pointer; color: var(--muted); font-size: 13px; }
  .fields { display: grid; gap: 8px; margin-top: 8px; }
  .fields label { display: grid; gap: 4px; font-size: 13px; color: var(--muted); }
  .fields input[type="text"], .fields input[type="password"] {
    padding: 8px 10px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--bg);
    color: var(--text);
    min-width: 0;
  }
  .row { display: flex; gap: 8px; align-items: center; font-size: 13px; color: var(--muted); }
  main {
    flex: 1 1 auto;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .msg {
    max-width: 85%;
    padding: 10px 14px;
    border-radius: 14px;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .msg.user { align-self: flex-end; background: var(--user); color: var(--user-text); border-bottom-right-radius: 4px; }
  .msg.bot { align-self: flex-start; background: var(--bot); border-bottom-left-radius: 4px; }
  .msg.error { align-self: stretch; color: var(--err); border: 1px solid var(--err); background: transparent; }
  .empty { color: var(--muted); text-align: center; margin-top: 40px; }
  form {
    display: flex;
    gap: 8px;
    padding: 12px 16px;
    background: var(--panel);
    border-top: 1px solid var(--border);
  }
  textarea {
    flex: 1 1 auto;
    resize: none;
    min-height: 44px;
    max-height: 160px;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--bg);
    color: var(--text);
    font: inherit;
  }
  button.send {
    padding: 0 18px;
    border: none;
    border-radius: 10px;
    background: var(--user);
    color: var(--user-text);
    font: inherit;
    cursor: pointer;
  }
  button.send:disabled { opacity: 0.5; cursor: default; }
  button.ghost {
    padding: 6px 10px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: transparent;
    color: var(--muted);
    font: inherit;
    font-size: 13px;
    cursor: pointer;
  }
  @media (max-width: 480px) {
    .msg { max-width: 92%; }
    main, form, header { padding-left: 12px; padding-right: 12px; }
  }
</style>
</head>
<body>

<header>
  <h1>My Local LLM</h1>
  <button class="ghost" id="clear" type="button">清除對話</button>
  <details class="settings" id="settings" open>
    <summary>連線設定</summary>
    <div class="fields">
      <label>API Base URL（Worker 網址，例如 https://llm-proxy.你的子網域.workers.dev/v1）
        <input type="text" id="endpoint" placeholder="https://llm-proxy.你的子網域.workers.dev/v1" autocomplete="off" spellcheck="false">
      </label>
      <label>存取密碼（Worker 的 PASSWORD，只存在這個分頁的記憶體中）
        <input type="password" id="token" placeholder="輸入存取密碼" autocomplete="off">
      </label>
      <label>模型 ID
        <input type="text" id="model" value="google/gemma-4-26b-a4b-qat" autocomplete="off" spellcheck="false">
      </label>
      <div class="row">
        <input type="checkbox" id="remember">
        <label for="remember">記住 Base URL 與模型（不會記住 token）</label>
      </div>
    </div>
  </details>
</header>

<main id="log">
  <div class="empty" id="empty">先在上方填好 Base URL 與 Token，再開始聊天。</div>
</main>

<form id="composer">
  <textarea id="input" rows="1" placeholder="輸入訊息（Enter 送出，Shift+Enter 換行）"></textarea>
  <button class="send" id="send" type="submit">送出</button>
</form>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const endpointEl = $("endpoint"), tokenEl = $("token"), modelEl = $("model"), rememberEl = $("remember");
  const logEl = $("log"), inputEl = $("input"), sendEl = $("send"), emptyEl = $("empty");

  // 只記住不敏感的設定；token 絕不寫入 localStorage
  const STORE_KEY = "llm-chat-settings";
  const STORE_TTL_MS = 24 * 60 * 60 * 1000;   // 保存超過 24 小時就自動清除
  function loadSettings() {
    try {
      const s = JSON.parse(localStorage.getItem(STORE_KEY) || "null");
      if (!s || Date.now() - (s.savedAt || 0) > STORE_TTL_MS) {
        localStorage.removeItem(STORE_KEY);   // 過期或格式不明，直接清掉
        return;
      }
      endpointEl.value = s.endpoint || "";
      modelEl.value = s.model || modelEl.value;
      rememberEl.checked = true;
    } catch (_) { /* 無法存取 localStorage 時直接忽略 */ }
  }
  function saveSettings() {
    try {
      if (rememberEl.checked) {
        const cur = { endpoint: endpointEl.value.trim(), model: modelEl.value.trim() };
        const old = JSON.parse(localStorage.getItem(STORE_KEY) || "null");
        // 設定沒變就沿用原本的時間，確保是「保存後 24 小時」而不是「最後使用後 24 小時」
        const same = old && old.endpoint === cur.endpoint && old.model === cur.model;
        localStorage.setItem(STORE_KEY, JSON.stringify({ ...cur, savedAt: same ? old.savedAt : Date.now() }));
      } else {
        localStorage.removeItem(STORE_KEY);
      }
    } catch (_) { /* 忽略 */ }
  }

  // 對話歷史只放在記憶體，重新整理即清空
  const history = [];

  function addMsg(role, text) {
    if (emptyEl) emptyEl.remove();
    const div = document.createElement("div");
    div.className = "msg " + role;
    div.textContent = text;   // 一律用 textContent，避免模型輸出被當成 HTML
    logEl.appendChild(div);
    logEl.scrollTop = logEl.scrollHeight;
    return div;
  }

  function chatUrl() {
    let base = endpointEl.value.trim().replace(/\/+$/, "");
    if (!base) throw new Error("請先填入 API Base URL");
    if (!/^https?:\/\//.test(base)) throw new Error("Base URL 需以 http:// 或 https:// 開頭");
    if (!base.endsWith("/v1")) base += "/v1";
    return base + "/chat/completions";
  }

  async function send(text) {
    const url = chatUrl();
    const headers = { "Content-Type": "application/json" };
    const token = tokenEl.value.trim();
    if (token) headers["Authorization"] = "Bearer " + token;

    history.push({ role: "user", content: text });
    addMsg("user", text);
    // Gemma 4 會先串流 reasoning_content（思考過程），content 出現前顯示「思考中」
    const botDiv = addMsg("bot", "思考中…");
    let answer = "";

    const res = await fetch(url, {
      method: "POST",
      headers,
      body: JSON.stringify({ model: modelEl.value.trim(), messages: history, stream: true }),
    });
    if (!res.ok) {
      const body = await res.text().catch(() => "");
      throw new Error(`HTTP ${res.status}：${body.slice(0, 300) || res.statusText}`);
    }

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buf = "";
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      let idx;
      while ((idx = buf.indexOf("\n")) >= 0) {
        const line = buf.slice(0, idx).trim();
        buf = buf.slice(idx + 1);
        if (!line.startsWith("data:")) continue;
        const data = line.slice(5).trim();
        if (data === "[DONE]") continue;
        try {
          const delta = JSON.parse(data).choices?.[0]?.delta?.content;
          if (delta) {
            answer += delta;
            botDiv.textContent = answer;
            logEl.scrollTop = logEl.scrollHeight;
          }
        } catch (_) { /* 忽略不完整的 SSE 行 */ }
      }
    }
    if (!answer) botDiv.textContent = "（模型沒有回傳內容）";
    history.push({ role: "assistant", content: answer });
  }

  $("composer").addEventListener("submit", async (e) => {
    e.preventDefault();
    const text = inputEl.value.trim();
    if (!text || sendEl.disabled) return;
    inputEl.value = "";
    sendEl.disabled = true;
    saveSettings();
    try {
      await send(text);
    } catch (err) {
      let msg = err.message || String(err);
      // 瀏覽器的 fetch 失敗通常是 CORS、網路或 HTTPS 憑證問題，給出提示
      if (err instanceof TypeError) {
        msg = "無法連線（" + msg + "）。請檢查：1) Base URL 是否為 HTTPS 且可從外部連到；2) Bionic 的 Enable CORS 是否開啟；3) Mac 是否仍在運作且未睡眠。";
      }
      addMsg("error", msg);
      // 失敗的這一輪不保留在歷史中
      if (history.length && history[history.length - 1].role === "user") history.pop();
    } finally {
      sendEl.disabled = false;
      inputEl.focus();
    }
  });

  inputEl.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey && !e.isComposing) {
      e.preventDefault();
      $("composer").requestSubmit();
    }
  });
  inputEl.addEventListener("input", () => {
    inputEl.style.height = "auto";
    inputEl.style.height = Math.min(inputEl.scrollHeight, 160) + "px";
  });

  $("clear").addEventListener("click", () => {
    history.length = 0;
    logEl.innerHTML = "";
    logEl.appendChild(emptyEl);
  });

  rememberEl.addEventListener("change", saveSettings);
  endpointEl.addEventListener("change", saveSettings);
  modelEl.addEventListener("change", saveSettings);

  loadSettings();
})();
</script>
</body>
</html>
